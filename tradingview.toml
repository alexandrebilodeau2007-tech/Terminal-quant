# =====================================================================
# BASE settings for the TradingView charts (CMP function, TradingView tab
# and the charts-only window)
# =====================================================================
# This file is read on every visit: ALL visitors see these settings when
# the page loads. A visitor can change the display on their screen, but
# their changes only last for their visit.
#
# To change the base for everyone: edit this file on GitHub (or replace it
# with the one exported from the app), then "Commit". The live app updates
# by itself within one to two minutes.
# =====================================================================

[display]
# Number of charts: 1, 2 (side by side) or 4 (2 x 2 grid)
layout = 1
# Height of EACH chart, in pixels (400 to 1400)
single_height = 820
grid_height = 520
# Candle interval: "1", "5", "15", "60", "240", "D", "W", "M"
interval = "D"
# Style: "1" candles, "9" hollow candles, "8" Heikin Ashi, "0" bars, "2" line, "3" area
style = "1"
timezone = "America/Toronto"
# Indicators added on load (names from the app's list, see interface/tradingview.py)
indicators = ["Exponential moving average", "Simple moving average", "RSI"]
side_toolbar = false
top_toolbar = false
date_ranges = true
legend = false
details_panel = false
hide_volume = true
# false = the settings panel is hidden: everyone sees exactly the base
allow_changes = true

# Indicator parameters (used when the indicator is in the list above). All are computed on the close.
# length = number of periods; mult = number of standard deviations of the Bollinger Bands.
[parameters]
"RSI" = { length = 21 }
"Simple moving average" = { length = 200 }
"Exponential moving average" = { length = 200 }
"Bollinger Bands" = { length = 20, mult = 2.0 }

# Colors (#RRGGBB format): candles, background and grid.
# Indicator line colors (RSI, moving averages) cannot be set in TradingView's
# free widgets: they can only be changed on screen (the indicator's gear icon).
[colors]
up = "#2ECC71"
down = "#FF5C5C"
background = "#0A0E14"
grid = "#1F2A37"

# One [[charts]] block per chart, in order (the first 4 are used).
# symbol: EXCHANGE:SYMBOL format (see the TradingView column of the directory, code TKR)
# compare: second symbol overlaid, or "" for none
# WARNING: the free widget does NOT display futures (COMEX:GC1!, NYMEX:CL1!…)
# or some indices. Use the spot equivalent (OANDA:XAUUSD, TVC:USOIL)
# or an ETF (AMEX:SPY, TSX:XIU).
[[charts]]
symbol = "OANDA:XAUUSD"
compare = "OANDA:XAGUSD"

[[charts]]
symbol = "AMEX:SPY"
compare = ""

[[charts]]
symbol = "TSX:RY"
compare = ""

[[charts]]
symbol = "TVC:USOIL"
compare = ""
